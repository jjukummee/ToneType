[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tonetype-prosody"
version = "0.1.0"
description = "CPU-first prosody analysis API for ToneType"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "google-cloud-speech>=2.34,<3",
  "google-genai>=1.33,<2",
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.18,<1",
  "scipy>=1.14,<2",
  "soundfile>=0.13,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
praat = ["praat-parselmouth>=0.4.6,<1"]
opensmile = ["opensmile>=2.5,<3"]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "pytest-cov>=6,<8"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
